    <style>
      :root {
        color-scheme: light dark;
        background: #f6f7f2;
        color: #18343a;
        font-family: "Noto Sans", sans-serif;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
      }

      .boot-screen {
        min-height: 100vh;
        display: grid;
        place-items: center;
        overflow: hidden;
        padding: 16px;
        background-color: #f6f7f2;
        background-image: radial-gradient(
          rgba(8, 127, 140, 0.13) 1px,
          transparent 1px
        );
        background-size: 28px 28px;
        color: #18343a;
        text-align: center;
      }

      .boot-content {
        display: grid;
        justify-items: center;
        gap: 20px;
      }

      .boot-deck {
        position: relative;
        width: 224px;
        height: 156px;
      }

      .boot-card {
        position: absolute;
        border-radius: 16px;
      }

      .boot-card-back-left {
        inset: 12px 30px 12px 10px;
        background: #087f8c;
        opacity: 0.6;
        transform: rotate(-8deg);
        animation: boot-left 3s ease-in-out infinite;
      }

      .boot-card-back-right {
        inset: 16px 12px 10px 28px;
        background: #ef8354;
        opacity: 0.72;
        transform: rotate(8deg);
        animation: boot-right 3s ease-in-out infinite;
      }

      .boot-card-front {
        inset: 4px 20px 16px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 16px;
        border: 1px solid rgba(8, 127, 140, 0.18);
        background: #fffefa;
        box-shadow: 0 18px 44px rgba(24, 52, 58, 0.12);
        text-align: left;
        animation: boot-float 2.8s ease-in-out infinite;
      }

      .boot-label {
        color: #607477;
        font-size: 12px;
        font-weight: 700;
        line-height: 1.2;
      }

      .boot-header {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .boot-book {
        width: 30px;
        height: 30px;
        display: grid;
        flex: none;
        place-items: center;
        border-radius: 10px;
        background: rgba(8, 127, 140, 0.1);
        color: #087f8c;
      }

      .boot-book svg {
        width: 20px;
        height: 20px;
        fill: currentColor;
      }

      .boot-translate {
        width: 24px;
        height: 24px;
        flex: none;
        margin-left: auto;
        fill: #ef8354;
      }

      .boot-word {
        display: block;
        font-size: 30px;
        font-weight: 800;
        line-height: 1.2;
      }

      .boot-translation {
        display: block;
        color: #607477;
        font-size: 14px;
        line-height: 1.2;
      }

      .boot-brand {
        display: block;
        width: max-content;
        max-width: 100%;
        margin: 0 auto;
        font-size: 24px;
        font-weight: 800;
        line-height: 1.2;
      }

      .boot-message {
        width: max-content;
        max-width: 100%;
        margin: 4px auto 0;
        color: #607477;
        font-size: 14px;
        line-height: 1.2;
      }

      .boot-dots {
        display: flex;
        justify-content: center;
        gap: 8px;
        margin: 0 auto;
      }

      .boot-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #087f8c;
        animation: boot-pulse 1.1s ease-in-out infinite;
      }

      .boot-dot:nth-child(2) {
        background: #ef8354;
        animation-delay: 0.16s;
      }

      .boot-dot:nth-child(3) {
        animation-delay: 0.32s;
      }

      @keyframes boot-left {
        50% {
          transform: translate(-7px, 3px) rotate(-11deg);
        }
      }

      @keyframes boot-right {
        50% {
          transform: translate(7px, -4px) rotate(11deg);
        }
      }

      @keyframes boot-float {
        50% {
          transform: translateY(-5px) rotate(1deg);
        }
      }

      @keyframes boot-pulse {
        0%,
        80%,
        100% {
          opacity: 0.35;
          transform: scale(0.8);
        }
        40% {
          opacity: 1;
          transform: scale(1.15);
        }
      }

      @media (prefers-color-scheme: dark) {
        :root {
          background: #101c21;
          color: #eff8f5;
        }

        .boot-screen {
          background-color: #101c21;
          background-image: radial-gradient(
            rgba(140, 226, 222, 0.16) 1px,
            transparent 1px
          );
          color: #eff8f5;
        }

        .boot-card-back-left {
          background: #48c6c8;
        }
        .boot-card-back-right {
          background: #ff9d73;
        }
        .boot-card-front {
          border-color: rgba(140, 226, 222, 0.2);
          background: #17282d;
          box-shadow: 0 18px 44px rgba(0, 0, 0, 0.3);
        }
        .boot-label,
        .boot-translation,
        .boot-message {
          color: #adc4c2;
        }
        .boot-book {
          background: rgba(72, 198, 200, 0.14);
          color: #48c6c8;
        }
        .boot-translate {
          fill: #ff9d73;
        }
        .boot-dot {
          background: #48c6c8;
        }
        .boot-dot:nth-child(2) {
          background: #ff9d73;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-card-back-left,
        .boot-card-back-right,
        .boot-card-front,
        .boot-dot {
          animation: none;
        }
      }
    </style>
